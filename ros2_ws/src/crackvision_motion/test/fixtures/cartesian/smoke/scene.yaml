# TEST-ONLY fixture scene for MOT-06.7 (scripts/ros/test_cartesian_plan.sh), generated by
# make_fixture.py -- do not hand-edit. Not the production scene (config/scene/scene.yaml).
# The specimen top face is exactly at z = 0.01 m, the paths3d.json surface height.
schema: crackvision.scene_config/1
frame: base_link
objects:
  - id: table
    shape: box
    dimensions_m: [1.20, 1.00, 0.05]
    pose:
      frame: base_link
      position_m: [0.35, 0.0, -0.025]
      rpy_rad: [0.0, 0.0, 0.0]
    value_status: nominal
    source: "test fixture: table top = base_link z=0 plane (same box as config/scene/scene.yaml)"
  - id: specimen
    shape: box
    dimensions_m: [0.2, 0.2, 0.01]
    pose:
      frame: base_link
      position_m: [0.26, 0.0, 0.005]
      rpy_rad: [0.0, 0.0, 0.0]
    value_status: nominal
    source: "test fixture: recommended placement centre and footprint, top face at the fixture surface height"
allowed_collisions:
  - link_a: table
    link_b: base_link
    reason: "the robot base stands on the table"
    value_status: nominal
    source: "test fixture"
  - link_a: specimen
    link_b: table
    reason: "the specimen rests on the table top"
    value_status: nominal
    source: "test fixture"
