# Startup check (TODO.md item 3, ABB SafeMove-style "synchronisation"): before a session's first enable (every motor
# on the bus disabled), every joint must read inside its window (rad, URDF frame) = the arm sits in its fold and
# the encoders agree with it. The windows are wide enough for every start logged on 2026-10-14..21 (J3 -0.347,
# J6 -0.259, J4 +0.18, J2 drooped +0.395) and catch a joint that reads a whole turn off or was re-zeroed elsewhere.
# J1 forgets its turn count over a power cycle (read +6.335/+6.278/+6.272 facing forward on 2026-10-18, otherwise
# within 0.08 of 0): its reading is unwrapped by whole turns into the window and the guard checks J1 with that
# offset for the rest of the session (raw = physical + 2*pi*k).
[startup]
turn_ambiguous = ["j1"]

[startup.window]
j1 = [-0.40, 0.40]
j2 = [-0.40, 0.50]
j3 = [-0.40, 0.05]
j4 = [-0.40, 0.40]
j5 = [-0.40, 0.40]
j6 = [-0.40, 0.40]
j7 = [-0.60, 0.10]

# Keep-out (metres, base_link frame; z = 0 is the mounting plane). Coarse proxies, not a mesh check: the planner
# (MoveIt, mesh collision) and the offline validator stay the precise layer; these catch gross errors.
# Values are NOT measured against the real workcell yet (MOT-10, scene.yaml is nominal).
[[keepout.floor]]
link = "gripper_link"
z_min = 0.12                   # the 2026-10-17 demo's table-clearance rule
[[keepout.floor]]
link = "link6"
z_min = 0.08
[[keepout.floor]]
link = "link5"
z_min = 0.08
[[keepout.floor]]
link = "link4"
z_min = 0.06

[keepout.base_cylinder]        # wrist/gripper must not enter the column around the base below the shoulder
radius = 0.09
z_max = 0.13
links = ["link5", "link6", "gripper_link"]

[keepout.segment]              # wrist/gripper must keep clear of the upper arm (link2 -> link3)
from_link = "link2"
to_link = "link3"
min_distance = 0.06
links = ["link5", "link6", "gripper_link"]

[register_writes]              # allowed outside config_writes(): the vendor SDK rewrites loop gains on every mode switch
allowed = { "25" = [0.0, 0.1], "26" = [0.0, 0.05], "27" = [0.0, 200.0], "28" = [0.0, 5.0] }
