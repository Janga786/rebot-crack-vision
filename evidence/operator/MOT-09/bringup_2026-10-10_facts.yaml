# Machine-readable transcription of the 2026-10-10 B601-DM bring-up evidence.
#
# Every value is read from a raw file in this directory (evidence/operator/MOT-09/), named in its `src`, or
# marked `src: operator statement`. Operator statements come from the operator's written instructions for the
# overnight session of 2026-10-10/11 and are not in the raw logs. The overnight Claude Code session filed this
# transcription. Human-readable version: bringup_2026-10-10_summary.md.
#
# This file is evidence, not configuration. Nothing reads it to enable motion. It records what was observed,
# and it explicitly records what was NOT established (see `not_established`). The vendor-driver readiness check
# (MOT-11) compares the vendor configuration in ~/rebot_ws against it.
kind: b601dm_bringup_facts
version: 1
date: "2026-10-10"
filed_by: "overnight Claude Code session on the operator's instruction (transcription only)"

