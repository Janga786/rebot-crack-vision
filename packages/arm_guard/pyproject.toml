[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm_guard"
version = "0.1.0"
description = "Last-line safety filter in front of every reBot B601-DM motorbridge command (docs/motion/ARM_GUARD.md)"
requires-python = ">=3.10"
dependencies = []          # stdlib only (tomli on Python 3.10)

[tool.setuptools]
py-modules = ["arm_guard_boot"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
